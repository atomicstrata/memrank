# The PUBLIC repository's own CI. This file SHIPS.
#
# WHY IT IS HERE AND NOT ONLY THERE. `atomicstrata/memrank` is a projection of a commit in this
# repository (`tools/project.py`, `localdocs/runbooks/public-projection.md`). Anything the public
# repo needs that is not in the projection has to be re-applied by hand after every export, and a
# post-export step nobody is present for is a step that stops happening. So the public workflow is
# a tracked file here, classified public by an EXACT-PATH rule in `publish.toml`, and it arrives
# with the tree.
#
# WHY IT DOES NOT RUN HERE. `.github/` is internal and every other workflow in it stays internal.
# This one is public, so it exists in both repositories, and a workflow that exists in two places
# runs in two places. `if: github.repository == 'atomicstrata/memrank'` is the whole of the
# targeting: in this repository every job is skipped, deliberately and visibly. It is a target
# selector, not a fallback mode -- nothing here degrades, it either runs or is not this repo.
#
# WHAT IS RED TODAY, AND WHY THAT IS THE POINT. Three surfaces are known-red in the public tree at
# the time of writing (2026-08-31, ATO-1829). None of them is suppressed here: no skip-list, no
# `continue-on-error`, no `|| true`. Each has its own job so the red is ATTRIBUTABLE to the ticket
# that owns it rather than smeared across one opaque failure.
#
#   tests      64 failures across 17 files -- `mem0` and `supermemory` are withheld from the
#              projection pending ATO-1831, and 17 test files name them as builtin refs. See
#              `tech-debt.md`, "THE COST, MEASURED, AND IT IS NOT PAID". Plus 5 failures that are
#              already red on `dev` and have nothing to do with the boundary.
#   lint       22 ruff findings, 40 mypy findings -- ALL pre-existing on `dev` (53 and 75 there;
#   types      the public subset is smaller only because internal files do not ship). Not caused
#              by the projection, and not this ticket's to fix.
#   lockfile   `uv sync --locked` fails: the projector rewrites `pyproject.toml` (it drops the
#              `api` extra and the internal console script), which invalidates the `uv.lock` it
#              ships alongside. ATO-1856's known gap. Until it lands, the other jobs resolve
#              dependencies fresh rather than from the lock, and this job states the cost in CI
#              instead of only in a document.
#
# BRANCH PROTECTION. Only the jobs that are actually green may be required status checks on day
# one; requiring a known-red check blocks every merge including the ones that would fix it. The
# staged list, and the `gh api` calls that apply it, are in
# `localdocs/runbooks/public-ci-and-branch-protection.md`.

name: public-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.ref }}
  cancel-in-progress: true

# NOTE ON `uv sync --extra dev`. It is deliberately NOT `--locked`: the projected tree ships a
# `uv.lock` its rewritten `pyproject.toml` no longer matches (ATO-1856). Every job below resolves
# fresh, and the `lockfile` job is what keeps that cost loud. When ATO-1856 lands, `--locked` goes
# on each sync step and that job is deleted.

jobs:
  # The boundary, checked by the published tree itself. `publish.toml` and `tools/manifest.py`
  # ship precisely so this can run here rather than being a promise made upstream.
  boundary:
    name: boundary
    runs-on: ubuntu-latest
    if: github.repository == 'atomicstrata/memrank'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - run: uv sync --extra dev
      - run: uv run pytest -q tests/repo/test_public_boundary.py tests/repo/test_projection.py

  lint:
    name: lint
    runs-on: ubuntu-latest
    if: github.repository == 'atomicstrata/memrank'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - run: uv sync --extra dev
      - run: uv run ruff check .

  types:
    name: types
    runs-on: ubuntu-latest
    if: github.repository == 'atomicstrata/memrank'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - run: uv sync --extra dev
      - run: uv run mypy memrank

  # The versions `pyproject.toml` actually claims: `requires-python = ">=3.10"`, and mypy's
  # `python_version = "3.10"`. 3.13 is NOT tested and is NOT claimed -- the dependency set has not
  # been verified there, and a matrix entry is a support claim.
  tests:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    if: github.repository == 'atomicstrata/memrank'
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      # `--python` as well as the action's `python-version`, which only exports `UV_PYTHON`. The
      # projected tree ships `.python-version` pinning 3.12; the env var already outranks it, but
      # a matrix that silently ran one interpreter three times is the failure worth two words.
      - run: uv sync --extra dev --python ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} pytest -q

  # Reproducibility, stated as a check rather than as a paragraph. RED until ATO-1856 makes the
  # projected lockfile agree with the projected `pyproject.toml`. It is a separate job so that gap
  # is visible without holding the rest of CI hostage, and so it turns green on its own the day it
  # is fixed.
  lockfile:
    name: lockfile (ATO-1856)
    runs-on: ubuntu-latest
    if: github.repository == 'atomicstrata/memrank'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra dev
